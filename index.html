<title>Record images</title>
<style>
  :root { color-scheme: light dark; --bg: #f1f3ef; --fg: #1c2a33; --link: #1f6f54; }

  main { max-width: 34em; margin: 0 auto; padding: 12vh 20px; }
  h1 { font-weight: 400; font-size: 1.8em; margin: 0 0 .5em; }

</style>
</head>
